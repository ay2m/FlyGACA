# Cloudflare Workers config (static assets) — a DORMANT MIRROR, not production.
# Production is Cloud Storage + Cloud Run behind a Google load balancer; see
# docs/RUNBOOK-golive.md. Kept deployable as a fallback: serves the Vite-built SPA
# from dist/ and runs worker/index.ts to proxy /api/* to the Cloud Run gateway,
# via `wrangler deploy`.
name = "flygaca"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

# Serve the built SPA from dist/. `run_worker_first = ["/api/*"]` makes the Worker
# run before the asset layer for /api/* (so the SPA fallback can't swallow an API
# call); everything else is served straight from assets, with the SPA fallback
# returning index.html for client-side routes.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Cloud Run origin the Worker proxies /api/* to. Repoint here rather than in
# worker/index.ts, which only falls back to this value.
[vars]
API_ORIGIN = "https://api.flygaca.com"
