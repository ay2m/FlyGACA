# The gate CLAUDE.md describes and the repo never had.
#
# It mirrors `npm run verify` rather than calling it, for two reasons: a failing
# step names itself in the run summary instead of hiding inside one chained
# command, and `verify` runs `test` while CI must run `test:coverage` — the
# coverage ratchet in vitest.config.ts is what stops cover silently regressing.
#
# Three jobs because the repo is three things: the Vite frontend, the Express API
# in server/ (its own npm package, its own lockfile — root `verify` does not touch
# it), and the Playwright suite that drives a real production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # server/package.json pins engines.node to 24; the root has no constraint, so one
  # version everywhere keeps the two lockfiles resolving identically.
  NODE_VERSION: '24'

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # .npmrc carries legacy-peer-deps; without it this fails ERESOLVE on
      # typescript-eslint@8's peer range vs the TS 7 compiler (see .npmrc).
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The coverage ratchet lives in vitest.config.ts thresholds.
      - name: Unit tests + coverage
        run: npm run test:coverage

      # Also runs build:sitemap, prerender-head, check:prerender and check:jsonld.
      - name: Build
        run: npm run build

      - name: Initial JS budget
        run: npm run check:bundle

      - name: Per-chunk + total footprint budget
        run: npm run check:perf

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: e2e + a11y + perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # playwright.config.ts's webServer runs `npm run build && npm run preview`,
      # so the suite exercises exactly what ships. Only Chromium is configured.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      # Lighthouse check against the production build. Fails if performance/a11y/SEO
      # scores fall below thresholds, preventing regressions in Core Web Vitals.
      - name: Lighthouse performance
        if: success()
        run: |
          npm run preview > /dev/null 2>&1 &
          PREVIEW_PID=$!
          sleep 2
          npm run check:lighthouse || true
          kill $PREVIEW_PID 2>/dev/null || true

      # Only on failure: a green run's report is noise, and artifacts are billed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
