name: iOS TestFlight Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App Flavor to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - pif
          - elp
          - dispatch
          - fleet
      upload_testflight:
        description: 'Upload to TestFlight via App Store Connect'
        required: true
        default: false
        type: boolean

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS (${{ inputs.flavor || 'main' }})
    runs-on: macos-15
    env:
      NODE_VERSION: '24'
      APP_FLAVOR: ${{ inputs.flavor || 'main' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Web Build & Test Suite
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Sync Capacitor iOS
        run: |
          npm run cap:sync
          npm run cap:localize

      - name: Build Xcode Project (Simulator Validation)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet build

      - name: Build Xcode Archive (Release)
        if: ${{ inputs.upload_testflight && env.APP_STORE_CONNECT_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-public-assets
          path: ios/App/App/public
          retention-days: 7
