name: Prerender coverage

# The full-body prerender takes >10 minutes (566 sitemap URLs, driven through a
# headless browser), so it is kept out of the per-PR `CI` workflow and given its
# own triggers:
#
#   push to main    the pre-deploy gate — nothing reaches a deploy with a
#                   sitemap URL that ships head-only;
#   pull_request    only when a file that can move the route set changes, so
#                   ordinary PRs stay fast but drift is caught before merge;
#   workflow_dispatch  on demand.
#
# scripts/prerender.mjs is deliberately non-fatal (a missing browser or a timed-out
# route warns and exits 0, leaving the head-only HTML from `npm run build` in
# place, so it can never break a deploy). That design only holds if something
# checks the result afterwards — scripts/check-prerender-coverage.mjs is that
# check, and this workflow is what finally runs it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Route table and the content indexes the sitemap expands from.
      - 'src/router.tsx'
      - 'src/pages/guides/guides.ts'
      - 'src/lib/prepCatalog.ts'
      - 'public/data/**'
      # The generator, the prerenderers and the gate itself.
      - 'scripts/build-sitemap.mjs'
      - 'scripts/prerender.mjs'
      - 'scripts/prerender-head.mjs'
      - 'scripts/check-prerender-coverage.mjs'
      - '.github/workflows/prerender.yml'
  workflow_dispatch:

concurrency:
  group: prerender-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prerender:
    name: prerender · sitemap coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          # Match ci.yml/deploy.yml (and server/'s engines pin) — this workflow
          # was the odd one out on Node 22.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Writes dist/ + the sitemap, with head-only snapshots for every route.
      - run: npm run build
      # Overwrites those with hydrated HTML. Non-fatal by design — the gate below
      # is what turns any shortfall into a failure.
      - run: npm run prerender
      - run: npm run check:prerender:coverage
