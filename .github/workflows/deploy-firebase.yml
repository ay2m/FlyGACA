name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

env:
  NODE_VERSION: '26'

jobs:
  deploy:
    name: build + prerender + deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Write build-time config
        run: |
          {
            echo "VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}"
          } >> .env.local

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prerender routes
        env:
          PRERENDER_MAX: '0'
          AR_CORPUS_MAX: '0'
        run: npm run prerender

      - name: Prerender coverage gate
        run: npm run check:prerender:coverage

      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
