name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Match ci.yml/deploy.yml — CI green on 24 says nothing about a build done on
  # a different major, so the deploying workflow uses the tested version.
  NODE_VERSION: '24'

jobs:
  deploy:
    name: build + prerender + deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Write build-time config
        run: |
          {
            # firebase.json rewrites /api/** to the flygaca-api Cloud Run
            # service, so this front is same-origin with the API too — same
            # reasoning as deploy.yml (keeps the session cookie same-site and
            # connect-src 'self' in the CSP).
            echo "VITE_API_SAME_ORIGIN=1"
            echo "VITE_DATA_BASE_URL=${{ vars.DATA_BASE_URL }}"
            echo "VITE_MOYASAR_PUBLISHABLE_KEY=${{ vars.MOYASAR_PUBLISHABLE_KEY || 'pk_live_wdGkyKmfuRaA1M7nJZDWoUeBAts1aZ4hsuE6b5zF' }}"
            echo "VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}"
            # Owner-provisioned repo vars; unset leaves Firebase telemetry off by
            # design (src/lib/firebase-monitoring.ts is inert without an appId).
            echo "VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}"
          } >> .env.local

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prerender routes
        env:
          PRERENDER_MAX: '0'
        run: npm run prerender

      - name: Prerender coverage gate
        run: npm run check:prerender:coverage

      # NOTE: `firebase login:ci` tokens are deprecated upstream in favour of
      # service-account / Workload Identity Federation auth (what deploy.yml
      # already uses for GCP). Migrating is an owner-side change — provision a
      # deployer SA + google-github-actions/auth and drop this secret.
      - name: Deploy to Firebase Hosting
        run: npx firebase deploy --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
