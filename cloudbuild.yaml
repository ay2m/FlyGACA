# Cloud Build config for the Fly GACA API image.
#
# This file exists because `gcloud run deploy --source .` cannot build this service.
# Cloud Run's source deploys only honour a Dockerfile at the ROOT of the source
# directory, and ours is at the root (`./Dockerfile`) — deliberately, because it copies
# `public/data/rag-chunks.json` into the image so the BM25 index needs no cold-start
# fetch, and that file is outside `server/`. Pointing `--source` at `server/` instead
# puts the corpus outside the build context and the COPY fails. So the build has to
# be an explicit `docker build -f Dockerfile .` from the repo root, exactly as
# `.dockerignore` and the Dockerfile's own header describe.
#
#   gcloud builds submit --config cloudbuild.yaml --region me-central2 .
#
# Pass _TAG to pin a release to a commit (CI does this):
#   --substitutions _TAG=$GITHUB_SHA
#
# See docs/RUNBOOK-golive.md for the deploy sequence and docs/RUNBOOK-deploy.md for
# first-time provisioning of the Artifact Registry repo, secrets and Cloud SQL.

substitutions:
  _REGION: me-central2
  _REPO: flygaca
  _SERVICE: flygaca-api
  _TAG: latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  # The context still carries rag-chunks.json (~14 MB) plus the server tree; the
  # default e2-medium builder works but is noticeably slower on the npm ci layers.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
